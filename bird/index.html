<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberBird 4.0</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: background-color 0.5s ease;
        }
        .bird {
            position: absolute;
            width: clamp(50px, 10vw, 100px);
            height: auto;
            aspect-ratio: 1 / 1;
            cursor: pointer;
            transition: 
                opacity 0.2s, 
                transform 0.2s;
            will-change: opacity, transform;
        }
        .bird:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <script>
        class CyberBirdApp {
            constructor() {
                this.backgroundColors = [
                    "#5aa9c2", "#b6d3ef", "#0099bd", 
                    "#0098db", "#50afe4", "#d7eaf9", 
                    "#88c4ec", "#91afd9", "#88cad2"
                ];
                
                this.birds = [
                    { src: 'bird1.png', name: 'bird1' },
                    { src: 'bird2.png', name: 'bird2' },
                    { src: 'bird3.png', name: 'bird3' },
                    { src: 'bird4.png', name: 'bird4' },
                    { src: 'bird5.png', name: 'bird5' }
                ];
                
                this.margin = 30;
                this.birdSize = 100;
                this.positions = [];
                
                this.init();
            }
            
            init() {
                this.setRandomBackground();
                
                this.createBirds();
                
                this.addResizeListener();
            }
            
            setRandomBackground() {
                const randomColor = this.backgroundColors[
                    Math.floor(Math.random() * this.backgroundColors.length)
                ];
                document.body.style.backgroundColor = randomColor;
            }
            
            getRandomPosition() {
                const screenWidth = window.innerWidth;
                const screenHeight = window.innerHeight;
                const effectiveBirdSize = Math.min(
                    this.birdSize, 
                    Math.min(screenWidth, screenHeight) * 0.2
                );
                
                let attempts = 0;
                const maxAttempts = 100;
                
                while (attempts < maxAttempts) {
                    const x = Math.random() * (screenWidth - 2 * this.margin - effectiveBirdSize) + this.margin;
                    const y = Math.random() * (screenHeight - 2 * this.margin - effectiveBirdSize) + this.margin;
                    
                    const isValidPosition = this.positions.every(pos => 
                        Math.hypot(pos.x - x, pos.y - y) > effectiveBirdSize
                    );
                    
                    if (isValidPosition) {
                        this.positions.push({ x, y });
                        return { x: `${x}px`, y: `${y}px` };
                    }
                    
                    attempts++;
                }
                
                return { x: `${this.margin}px`, y: `${this.margin}px` };
            }
            
            createBirds() {
                this.positions = [];
                document.querySelectorAll('.bird').forEach(bird => bird.remove());
                
                this.birds.forEach((birdData) => {
                    const img = document.createElement('img');
                    img.src = birdData.src;
                    img.alt = birdData.name;
                    img.className = 'bird';
                    
                    const pos = this.getRandomPosition();
                    img.style.left = pos.x;
                    img.style.top = pos.y;
                    
                    img.addEventListener('click', () => this.blinkBird(img, birdData.name));
                    
                    img.addEventListener('error', () => {
                        console.error(`Failed to load image: ${birdData.src}`);
                        img.style.display = 'none';
                    });
                    
                    document.body.appendChild(img);
                });
            }
            
            blinkBird(img, birdName) {
                img.style.opacity = 0.5;
                setTimeout(() => { img.style.opacity = 1; }, 200);
                
                this.sendBirdData(birdName);
            }
            
            sendBirdData(birdName) {
                fetch('https://vocal-tolerant-anchovy.ngrok-free.app', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bird: birdName })
                })
                .then(response => response.text())
                .then(data => console.log('Server Response:', data))
                .catch(error => console.error('Send Error:', error));
            }
            
            addResizeListener() {
                let resizeTimer;
                window.addEventListener('resize', () => {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(() => {
                        this.createBirds();
                    }, 250);
                });
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            new CyberBirdApp();
        });
    </script>
</body>
</html>
