---
title: Música
layout: "base.njk"
---

<div class="post-mosaic">
  {% for musica in collections.musica %}
  <a class="general" href="{{musica.url}}">
    <div class="post-container">
      <div class="post-info">
        <h3 class="post-title">{{ musica.data.title }}</h3>
        <p class="post-slug">{{ musica.data.slug }}</p>
      </div>
      <img
        src="{{ musica.data.image }}"
        alt="{{ musica.data.title }}"
        class="post-img"
      />
    </div>
  </a>
  {% endfor %}
</div>
