<div id="staves" aria-hidden="true">
  <div class="staff"></div>
  <div class="staff"></div>
</div>

<div id="stage"></div>

<style>
  html,
  body {
    height: 100%;
    overflow: hidden;
    padding: 0;
  }
  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }
  #stage img {
    position: absolute;
    margin: 0;
    max-width: none;
    height: auto;
    opacity: 0;
    user-select: none;
    z-index: 1;
  }

  #staves {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly; /* spreads the staves down the screen */
    padding: 0 4vw;
    pointer-events: none;

    --gap: clamp(14px, 2.6vh, 30px); /* distance between the 5 lines */
    --line: rgba(221, 221, 187, 0.45); /* your --color-primary, translucent */
  }

  .staff {
    position: relative;
    height: calc(var(--gap) * 4 + 1px);
    /* a 1px line every --gap pixels; 5 lines fit in this height */
    background: repeating-linear-gradient(
      to bottom,
      var(--line) 0 1px,
      transparent 1px var(--gap)
    );
  }

  /* barlines at the start and end of each staff, like a printed score */
  .staff::before,
  .staff::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    width: 1px;
    background: var(--line);
  }
  .staff::before {
    left: 0;
  }
  .staff::after {
    right: 0;
  }
</style>

<script>
  const SYMBOLS = [
    "s1",
    "s2",
    "s3",
    "s4",
    "s5",
    "s6",
    "s7",
    "s8",
    "s9",
    "s10",
    "s11",
    "s12",
  ];
  const EXT = "png";
  const BASE = "/improvisa/symbols/";

  const LIVE_POLL_MS = 2000; // how often to ask for new clicks
  const LIVE_LIFETIME_MS = 10000; // a live symbol stays 30s, then fades
  const FADE_IN_MS = 1500;
  const FADE_OUT_MS = 2000;
  const MAX_ON_SCREEN = 150; // safety cap for slower computers

  const stage = document.getElementById("stage");
  const onScreen = [];

  SYMBOLS.forEach((s) => {
    new Image().src = `${BASE}${s}.${EXT}`;
  });

  const rand = (min, max) => Math.random() * (max - min) + min;

  // Draws one symbol at a random size/position/rotation and removes it after its lifetime
  function spawn(symbol, lifetimeMs) {
    const img = document.createElement("img");
    img.src = `${BASE}${symbol}.${EXT}`;
    img.alt = "";
    img.style.width = rand(8, 40) + "vw";
    img.style.left = rand(-5, 90) + "vw";
    img.style.top = rand(-5, 80) + "vh";
    img.style.transform = `rotate(${rand(0, 360)}deg)`;
    stage.appendChild(img);
    onScreen.push(img);

    function leave() {
      if (img.dataset.leaving) return;
      img.dataset.leaving = "1";
      img.style.transition = `opacity ${FADE_OUT_MS}ms`;
      img.style.opacity = 0;
      setTimeout(() => {
        img.remove();
        const i = onScreen.indexOf(img);
        if (i !== -1) onScreen.splice(i, 1);
      }, FADE_OUT_MS);
    }
    img._leave = leave;

    img.onload = () =>
      requestAnimationFrame(() => {
        if (img.dataset.leaving) return;
        img.style.transition = `opacity ${FADE_IN_MS}ms`;
        img.style.opacity = 1;
      });

    setTimeout(leave, lifetimeMs);

    // too many on screen: retire the oldest one early
    if (onScreen.length > MAX_ON_SCREEN) {
      const oldest = onScreen.find((el) => !el.dataset.leaving);
      if (oldest) oldest._leave();
    }
  }

  // ---- Replay of the history with the ORIGINAL timing ----
  const REPLAY_LIFETIME_MS = 30000; // how long each replayed symbol stays
  const MAX_GAP_MS = 4000; // any pause longer than this is shortened to this
  const WRAP_PAUSE_MS = 3000; // pause before restarting from the top
  const REPLAY_SPEED = 1; // 1 = original speed, 2 = twice as fast

  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

  let replayCursor = 0;
  let replayPrevT = null;
  let cycleStartedAt = Date.now();

  async function replayLoop() {
    while (true) {
      try {
        const res = await fetch(`/api/replay?after=${replayCursor}`);
        if (!res.ok) throw new Error("/api/replay returned " + res.status);
        const { items } = await res.json();

        if (items.length === 0) {
          // end of history (or it's empty): wait until the last symbols have
          // faded before starting over, so no click is ever on screen twice
          const elapsed = Date.now() - cycleStartedAt;
          replayCursor = 0;
          replayPrevT = null;
          await sleep(Math.max(WRAP_PAUSE_MS, REPLAY_LIFETIME_MS - elapsed));
          cycleStartedAt = Date.now();
          continue;
        }

        for (const item of items) {
          let gap = 0;
          if (replayPrevT !== null && item.t != null) {
            gap =
              Math.min(Math.max(item.t - replayPrevT, 0), MAX_GAP_MS) /
              REPLAY_SPEED;
          }
          if (item.t != null) replayPrevT = item.t;

          await sleep(gap);
          spawn(item.symbol, REPLAY_LIFETIME_MS);
          replayCursor = item.id;
        }
      } catch (err) {
        console.error(err);
        await sleep(WRAP_PAUSE_MS); // don't hammer the server if something is wrong
      }
    }
  }

  replayLoop();

  // ---- Loop 2: live clicks, drawn as they arrive ----
  let liveCursor = null; // null until we learn where "now" is

  async function pollLive() {
    if (document.hidden) return; // don't waste requests if the tab is hidden
    try {
      const url =
        liveCursor === null
          ? "/api/since?after=latest"
          : `/api/since?after=${liveCursor}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error("/api/since returned " + res.status);
      const data = await res.json();
      liveCursor = data.cursor;

      // spread this poll's clicks over the polling interval so it feels continuous
      const n = data.items.length;
      data.items.forEach((item, i) => {
        setTimeout(
          () => spawn(item.symbol, LIVE_LIFETIME_MS),
          (i / n) * LIVE_POLL_MS,
        );
      });
    } catch (err) {
      console.error(err);
    }
  }

  async function liveLoop() {
    await pollLive();
    setTimeout(liveLoop, LIVE_POLL_MS);
  }
  liveLoop();
</script>
