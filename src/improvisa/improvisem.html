<div id="staves" aria-hidden="true">
  <div class="staff"></div>
  <div class="staff"></div>
</div>

<div id="stage"></div>

<div id="controls">
  <button id="btn-loop" class="ctl" type="button" aria-pressed="true">
    Loop
  </button>
  <button id="btn-live" class="ctl" type="button" aria-pressed="false">
    Live
  </button>
</div>

<style>
  html,
  body {
    height: 100%;
    overflow: hidden;
    padding: 0;
  }
  body.idle {
    cursor: none; /* hides the mouse pointer on the projection */
  }
  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }
  #stage img {
    position: absolute;
    margin: 0;
    max-width: none;
    height: auto;
    opacity: 0;
    user-select: none;
    z-index: 1;
  }

  #staves {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    padding: 0 4vw;
    pointer-events: none;
    --gap: clamp(14px, 2.6vh, 30px);
    --line: rgba(221, 221, 187, 0.45);
  }
  .staff {
    position: relative;
    height: calc(var(--gap) * 4 + 1px);
    background: repeating-linear-gradient(
      to bottom,
      var(--line) 0 1px,
      transparent 1px var(--gap)
    );
  }
  .staff::before,
  .staff::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    width: 1px;
    background: var(--line);
  }
  .staff::before {
    left: 0;
  }
  .staff::after {
    right: 0;
  }

  /* control bar: invisible until you move the mouse or touch the screen */
  #controls {
    position: fixed;
    left: 50%;
    bottom: 1.5rem;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.5rem;
    padding: 0.5rem;
    background: rgba(17, 17, 17, 0.85);
    border: 1px solid var(--color-primary);
    opacity: 0;
    pointer-events: none; /* invisible buttons can't be clicked by accident */
    transition: opacity 0.3s;
  }
  #controls.visible {
    opacity: 1;
    pointer-events: auto;
  }
  .ctl {
    font-family: var(--font-primary);
    font-size: 1rem;
    padding: 0.5rem 1rem;
    color: var(--color-primary);
    background: var(--color-dark);
    border: 1px solid var(--color-primary);
    cursor: pointer;
  }
  .ctl[aria-pressed="true"] {
    background: var(--color-primary);
    color: var(--color-dark);
  }
</style>

<script>
  const SYMBOLS = [
    "s1",
    "s2",
    "s3",
    "s4",
    "s5",
    "s6",
    "s7",
    "s8",
    "s9",
    "s10",
    "s11",
    "s12",
  ];
  const EXT = "png";
  const BASE = "/improvisa/symbols/";

  const LIVE_POLL_MS = 2000; // how often to ask for new clicks
  const LIVE_LIFETIME_MS = 10000; // a live symbol stays 10s, then fades
  const REPLAY_LIFETIME_MS = 30000; // a replayed symbol stays 30s
  const MAX_GAP_MS = 4000; // any pause longer than this is shortened to this
  const WRAP_PAUSE_MS = 3000; // minimum pause before the loop restarts
  const REPLAY_SPEED = 1; // 1 = original speed, 2 = twice as fast
  const FADE_IN_MS = 1500;
  const FADE_OUT_MS = 2000;
  const MAX_ON_SCREEN = 150; // safety cap for slower computers
  const REPLAY_BATCH = 7; // X: how many symbols at a time in loop mode
  const BATCH_PAUSE_MS = 1000; // empty pause between one batch and the next (0 = none)

  let mode = "loop"; // "loop" = replay the history, "live" = draw clicks as they arrive

  const stage = document.getElementById("stage");
  const onScreen = [];

  SYMBOLS.forEach((s) => {
    new Image().src = `${BASE}${s}.${EXT}`;
  });

  const rand = (min, max) => Math.random() * (max - min) + min;
  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

  // Draws one symbol at a random size/position/rotation and removes it after its lifetime
  function spawn(symbol, lifetimeMs) {
    const img = document.createElement("img");
    img.src = `${BASE}${symbol}.${EXT}`;
    img.alt = "";
    img.style.width = rand(8, 40) + "vw";
    img.style.left = rand(-5, 90) + "vw";
    img.style.top = rand(-5, 80) + "vh";
    img.style.transform = `rotate(${rand(0, 360)}deg)`;
    stage.appendChild(img);
    onScreen.push(img);

    let resolveGone;
    const gone = new Promise((resolve) => {
      resolveGone = resolve;
    });

    function leave() {
      if (img.dataset.leaving) return;
      img.dataset.leaving = "1";
      img.style.transition = `opacity ${FADE_OUT_MS}ms`;
      img.style.opacity = 0;
      setTimeout(() => {
        img.remove();
        const i = onScreen.indexOf(img);
        if (i !== -1) onScreen.splice(i, 1);
        resolveGone(); // "this symbol is completely gone"
      }, FADE_OUT_MS);
    }
    img._leave = leave;

    img.onload = () =>
      requestAnimationFrame(() => {
        if (img.dataset.leaving) return;
        img.style.transition = `opacity ${FADE_IN_MS}ms`;
        img.style.opacity = 1;
      });

    setTimeout(leave, lifetimeMs);

    if (onScreen.length > MAX_ON_SCREEN) {
      const oldest = onScreen.find((el) => !el.dataset.leaving);
      if (oldest) oldest._leave();
    }

    return gone;
  }

  // ---- LOOP mode: X symbols at a time; the next X only come after all have faded out ----
  let replayCursor = 0;

  async function replayLoop() {
    while (true) {
      if (mode !== "loop") {
        await sleep(300);
        continue;
      }
      try {
        const res = await fetch(
          `/api/replay?after=${replayCursor}&limit=${REPLAY_BATCH}`,
        );
        if (!res.ok) throw new Error("/api/replay returned " + res.status);
        const { items } = await res.json();

        if (items.length === 0) {
          // end of history: start again from the top
          const wasAtStart = replayCursor === 0;
          replayCursor = 0;
          if (wasAtStart) await sleep(WRAP_PAUSE_MS); // database is empty: look again in a few seconds
          continue;
        }

        const gone = []; // one promise per symbol, resolved when it has fully faded out
        let prevT = null;

        for (const item of items) {
          if (mode !== "loop") break;

          // keep the original rhythm between the symbols of this batch
          let gap = 0;
          if (prevT !== null && item.t != null) {
            gap =
              Math.min(Math.max(item.t - prevT, 0), MAX_GAP_MS) / REPLAY_SPEED;
          }
          if (item.t != null) prevT = item.t;

          await sleep(gap);
          if (mode !== "loop") break; // the mode may have changed during the pause
          gone.push(spawn(item.symbol, REPLAY_LIFETIME_MS));
          replayCursor = item.id;
        }

        // the next batch starts only when every symbol of this one has disappeared
        await Promise.all(gone);
        await sleep(BATCH_PAUSE_MS);
      } catch (err) {
        console.error(err);
        await sleep(WRAP_PAUSE_MS);
      }
    }
  }

  // ---- LIVE mode: draw clicks as they arrive ----
  let liveCursor = null; // null until we learn where "now" is
  let polling = false;

  async function pollLive() {
    if (polling) return; // never run two polls at once
    if (document.hidden || mode !== "live") {
      liveCursor = null; // when live mode returns, start from "now", not from the past
      return;
    }
    polling = true;
    try {
      const url =
        liveCursor === null
          ? "/api/since?after=latest"
          : `/api/since?after=${liveCursor}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error("/api/since returned " + res.status);
      const data = await res.json();
      liveCursor = data.cursor;

      const n = data.items.length;
      data.items.forEach((item, i) => {
        setTimeout(
          () => {
            if (mode === "live") spawn(item.symbol, LIVE_LIFETIME_MS);
          },
          (i / n) * LIVE_POLL_MS,
        );
      });
    } catch (err) {
      console.error(err);
    } finally {
      polling = false;
    }
  }

  async function liveLoop() {
    await pollLive();
    setTimeout(liveLoop, LIVE_POLL_MS);
  }

  // ---- Controls ----
  const controls = document.getElementById("controls");
  const btnLoop = document.getElementById("btn-loop");
  const btnLive = document.getElementById("btn-live");

  function setMode(newMode) {
    const previous = mode;
    mode = newMode;
    btnLoop.setAttribute("aria-pressed", String(mode === "loop"));
    btnLive.setAttribute("aria-pressed", String(mode === "live"));
    if (mode === "live" && previous !== "live") pollLive(); // start listening right away
  }
  btnLoop.addEventListener("click", () => setMode("loop"));
  btnLive.addEventListener("click", () => setMode("live"));

  // show the control bar when the mouse moves or the screen is touched, hide it after 3s
  let hideTimer;
  function showControls() {
    controls.classList.add("visible");
    document.body.classList.remove("idle");
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      controls.classList.remove("visible");
      document.body.classList.add("idle");
    }, 3000);
  }
  ["mousemove", "pointerdown", "keydown"].forEach((ev) =>
    document.addEventListener(ev, showControls),
  );

  // ---- Start (each loop is started exactly once) ----
  replayLoop();
  liveLoop();
</script>
