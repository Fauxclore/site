<style>
  body {
    padding: 0;
  }

  /* column layout: instruction on top, symbols fill the rest */
  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #instruction {
    min-height: 8rem; /* reserves space so the page doesn't jump */
    margin: 0;
    padding: 2rem 1.5rem 0;
    text-align: center; /* your body is justified, so override */
    font-size: clamp(1.1rem, 3vw, 1.6rem);
    white-space: pre-line; /* lets you use line breaks in the text */
  }

  .sym-field {
    flex: 1;
    display: flex;
    flex-wrap: wrap;
    align-content: center;
    justify-content: center;
    gap: 2rem;
    padding: 2rem;
  }
  .sym {
    width: clamp(80px, 18vw, 140px);
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition:
      opacity 0.4s,
      filter 0.4s;
  }
  .sym img {
    pointer-events: none;
  }
  .sym:focus-visible {
    outline: 2px dashed var(--color-red);
    outline-offset: 6px;
  }

  .sym-field.has-playing .sym:not(.playing) {
    opacity: 0.35;
  }

  .sym.playing {
    filter: drop-shadow(0 0 14px var(--color-red));
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,
    100% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.08);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .sym.playing {
      animation: none;
    }
  }
</style>

<script>
  const field = document.querySelector(".sym-field");
  const instruction = document.getElementById("instruction");
  const buttons = document.querySelectorAll(".sym");
  const reduceMotion = window.matchMedia(
    "(prefers-reduced-motion: reduce)",
  ).matches;
  const sounds = {};
  let currentId = null;

  // marks which symbol is playing (or none) and shows its instruction
  function setPlaying(id) {
    currentId = id;
    let text = "";
    buttons.forEach((b) => {
      const on = b.dataset.symbol === id;
      b.classList.toggle("playing", on);
      b.setAttribute("aria-pressed", on);
      if (on) text = b.dataset.instruction || "";
    });
    instruction.textContent = text;
    field.classList.toggle("has-playing", id !== null);
  }

  function stopSound(id) {
    sounds[id].pause();
    sounds[id].currentTime = 0;
  }

  buttons.forEach((btn) => {
    const id = btn.dataset.symbol;

    const audio = new Audio(btn.dataset.sound);
    audio.loop = true;
    audio.preload = "auto";
    sounds[id] = audio;

    btn.addEventListener("click", () => {
      if (currentId === id) {
        stopSound(id);
        setPlaying(null);
      } else {
        if (currentId) stopSound(currentId);
        setPlaying(id);
        window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
        sounds[id].play().catch((e) => {
          console.error("som não tocou:", e);
          if (currentId === id) setPlaying(null);
        });
      }

      fetch("/api/click", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ symbol: id }),
      }).catch((e) => console.error("click não gravado:", e));
    });
  });
</script>
