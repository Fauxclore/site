<div class="main">
  <h1>Improvisa</h1>

  <div class="sym-field">
    <button
      class="sym"
      data-symbol="back"
      data-sound="/improvisa/sounds/back.mp3"
      aria-label="back"
    >
      <img src="/improvisa/symbols/back.svg" alt="" draggable="false" />
    </button>
    <button
      class="sym"
      data-symbol="forward"
      data-sound="/improvisa/sounds/forward.mp3"
      aria-label="forward"
    >
      <img src="/improvisa/symbols/forward.svg" alt="" draggable="false" />
    </button>
    <button
      class="sym"
      data-symbol="metronomo"
      data-sound="/improvisa/sounds/metronomo.mp3"
      aria-label="metrónomo"
    >
      <img src="/improvisa/symbols/metronomo.svg" alt="" draggable="false" />
    </button>
    <button
      class="sym"
      data-symbol="pausa"
      data-sound="/improvisa/sounds/pausa.mp3"
      aria-label="pausa"
    >
      <img src="/improvisa/symbols/pausa.svg" alt="" draggable="false" />
    </button>
    <button
      class="sym"
      data-symbol="play"
      data-sound="/improvisa/sounds/play.mp3"
      aria-label="play"
    >
      <img src="/improvisa/symbols/play.svg" alt="" draggable="false" />
    </button>
    <button
      class="sym"
      data-symbol="sax"
      data-sound="/improvisa/sounds/sax.mp3"
      aria-label="sax"
    >
      <img src="/improvisa/symbols/sax.svg" alt="" draggable="false" />
    </button>
    <button
      class="sym"
      data-symbol="tambor"
      data-sound="/improvisa/sounds/tambor.mp3"
      aria-label="tambor"
    >
      <img src="/improvisa/symbols/tambor.svg" alt="" draggable="false" />
    </button>
    <button
      class="sym"
      data-symbol="teclado"
      data-sound="/improvisa/sounds/teclado.mp3"
      aria-label="teclado"
    >
      <img src="/improvisa/symbols/teclado.svg" alt="" draggable="false" />
    </button>
  </div>
</div>

<style>
  body {
    padding: 0;
  }
  .sym-field {
    min-height: 100vh;
    display: flex;
    flex-wrap: wrap;
    align-content: center;
    justify-content: center;
    gap: 2rem;
    padding: 2rem;
  }
  .sym {
    width: clamp(80px, 18vw, 140px);
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition:
      opacity 0.4s,
      filter 0.4s;
  }
  .sym img {
    pointer-events: none;
  }
  .sym:focus-visible {
    outline: 2px dashed var(--color-red);
    outline-offset: 6px;
  }

  /* quando algum som está a tocar, os outros esmaecem */
  .sym-field.has-playing .sym:not(.playing) {
    opacity: 0.35;
  }

  /* o símbolo ativo: brilho + pulsação lenta */
  .sym.playing {
    filter: drop-shadow(0 0 14px var(--color-red));
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,
    100% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.08);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .sym.playing {
      animation: none;
    }
  }
</style>

<script>
  const field = document.querySelector(".sym-field");
  const buttons = document.querySelectorAll(".sym");
  const sounds = {};
  let currentId = null;

  // marca visualmente qual está a tocar (ou nenhum, se id for null)
  function setPlaying(id) {
    currentId = id;
    buttons.forEach((b) => {
      const on = b.dataset.symbol === id;
      b.classList.toggle("playing", on);
      b.setAttribute("aria-pressed", on);
    });
    field.classList.toggle("has-playing", id !== null);
  }

  function stopSound(id) {
    sounds[id].pause();
    sounds[id].currentTime = 0;
  }

  buttons.forEach((btn) => {
    const id = btn.dataset.symbol;

    const audio = new Audio(btn.dataset.sound);
    audio.loop = true;
    audio.preload = "auto";
    sounds[id] = audio;

    btn.addEventListener("click", () => {
      if (currentId === id) {
        stopSound(id);
        setPlaying(null);
      } else {
        if (currentId) stopSound(currentId);
        setPlaying(id);
        // se o som falhar (ficheiro em falta, etc.), o indicador não fica a mentir
        sounds[id].play().catch((e) => {
          console.error("som não tocou:", e);
          if (currentId === id) setPlaying(null);
        });
      }

      fetch("/api/click", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ symbol: id }),
      }).catch((e) => console.error("click não gravado:", e));
    });
  });
</script>
