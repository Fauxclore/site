<div id="stage"></div>

<style>
  html,
  body {
    height: 100%;
    overflow: hidden;
    padding: 0;
  }
  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }
  #stage img {
    position: absolute;
    margin: 0;
    max-width: none;
    height: auto;
    opacity: 0;
    user-select: none;
  }
</style>

<script>
  const SYMBOLS = [
    "back",
    "forward",
    "metronomo",
    "pausa",
    "play",
    "sax",
    "tambor",
    "teclado",
  ];
  const EXT = "png";
  const BASE = "/improvisa/symbols/";

  const HISTORY_EVERY_MS = 15000; // background replay: 5 old symbols every 30s
  const HISTORY_LIFETIME_MS = 14000; // they fade just before the next batch
  const LIVE_POLL_MS = 2000; // how often to ask for new clicks
  const LIVE_LIFETIME_MS = 10000; // a live symbol stays 30s, then fades
  const FADE_IN_MS = 600;
  const FADE_OUT_MS = 2000;
  const MAX_ON_SCREEN = 150; // safety cap for slower computers

  const stage = document.getElementById("stage");
  const onScreen = [];

  SYMBOLS.forEach((s) => {
    new Image().src = `${BASE}${s}.${EXT}`;
  });

  const rand = (min, max) => Math.random() * (max - min) + min;

  // Draws one symbol at a random size/position/rotation and removes it after its lifetime
  function spawn(symbol, lifetimeMs) {
    const img = document.createElement("img");
    img.src = `${BASE}${symbol}.${EXT}`;
    img.alt = "";
    img.style.width = rand(8, 40) + "vw";
    img.style.left = rand(-5, 90) + "vw";
    img.style.top = rand(-5, 80) + "vh";
    img.style.transform = `rotate(${rand(0, 360)}deg)`;
    stage.appendChild(img);
    onScreen.push(img);

    function leave() {
      if (img.dataset.leaving) return;
      img.dataset.leaving = "1";
      img.style.transition = `opacity ${FADE_OUT_MS}ms`;
      img.style.opacity = 0;
      setTimeout(() => {
        img.remove();
        const i = onScreen.indexOf(img);
        if (i !== -1) onScreen.splice(i, 1);
      }, FADE_OUT_MS);
    }
    img._leave = leave;

    img.onload = () =>
      requestAnimationFrame(() => {
        if (img.dataset.leaving) return;
        img.style.transition = `opacity ${FADE_IN_MS}ms`;
        img.style.opacity = 1;
      });

    setTimeout(leave, lifetimeMs);

    // too many on screen: retire the oldest one early
    if (onScreen.length > MAX_ON_SCREEN) {
      const oldest = onScreen.find((el) => !el.dataset.leaving);
      if (oldest) oldest._leave();
    }
  }

  // ---- Loop 1: background replay of the history (keeps the screen never blank) ----
  let historyCursor = 0;

  async function historyBatch() {
    try {
      const res = await fetch(`/api/next?after=${historyCursor}`);
      if (!res.ok) throw new Error("/api/next returned " + res.status);
      const data = await res.json();
      historyCursor = data.cursor;
      data.items.forEach((item) => spawn(item.symbol, HISTORY_LIFETIME_MS));
    } catch (err) {
      console.error(err);
    }
  }

  // ---- Loop 2: live clicks, drawn as they arrive ----
  let liveCursor = null; // null until we learn where "now" is

  async function pollLive() {
    if (document.hidden) return; // don't waste requests if the tab is hidden
    try {
      const url =
        liveCursor === null
          ? "/api/since?after=latest"
          : `/api/since?after=${liveCursor}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error("/api/since returned " + res.status);
      const data = await res.json();
      liveCursor = data.cursor;

      // spread this poll's clicks over the polling interval so it feels continuous
      const n = data.items.length;
      data.items.forEach((item, i) => {
        setTimeout(
          () => spawn(item.symbol, LIVE_LIFETIME_MS),
          (i / n) * LIVE_POLL_MS,
        );
      });
    } catch (err) {
      console.error(err);
    }
  }

  async function liveLoop() {
    await pollLive();
    setTimeout(liveLoop, LIVE_POLL_MS); // waits for each poll to finish, so no overlaps
  }

  historyBatch();
  setInterval(historyBatch, HISTORY_EVERY_MS);
  liveLoop();
</script>
