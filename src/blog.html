---
title: Blog
layout: "base.njk"
tags:
  - post
image: /img/b_slowtech.webp
slug: Blog Pessoal.
date: 2025-08-05
---

{% for blog in collections.blog %}
<hr />
<h3><a class="general" href="{{blog.url}}">{{ blog.data.title }}</a></h3>
<h6>{{ blog.data.date | postDate }}</h6>
<p class="blog-slug">{{ blog.data.slug }}</p>
<div>
  <a href="{{blog.url}}">
    <img
      src="{{ blog.data.image }}"
      alt="{{ blog.data.title }}"
      class="post-img"
  /></a>
</div>
{% endfor %}
