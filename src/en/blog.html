---
title: Blog
layout: "base_en.njk"
tags:
  - post_en
image: /img/b_slowtech.webp
slug: Personal Blog.
date: 2025-08-05
---

{% for blog_en in collections.blog_en %}
<hr />
<h3>
  <a class="title-link" href="{{blog_en.url}}">{{ blog_en.data.title }}</a>
</h3>
<h6>{{ blog_en.data.date | postDate }}</h6>
<p class="blog-slug">{{ blog_en.data.slug }}</p>
<div>
  <a href="{{blog_en.url}}">
    <img
      src="{{ blog_en.data.image }}"
      alt="{{ blog_en.data.title }}"
      class="post-img"
  /></a>
</div>
{% endfor %}
