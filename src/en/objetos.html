---
title: Sound Objects
layout: "base_en.njk"
---

<div class="post-mosaic">
  {% for objeto_en in collections.objeto_en %}
  <a href="{{objeto_en.url}}">
    <div class="post-container">
      <div class="post-info">
        <h3 class="post-title">{{ objeto_en.data.title }}</h3>
        <p class="post-slug">{{ objeto_en.data.slug }}</p>
      </div>
      <img
        src="{{ objeto_en.data.image }}"
        alt="{{ objeto_en.data.title }}"
        class="post-img"
      />
    </div>
  </a>
  {% endfor %}
</div>
