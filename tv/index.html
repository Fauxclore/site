<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <title>TV</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #111;
        overflow: hidden;
      }
      iframe {
        width: 100vw;
        height: 100vh;
        border: 0;
        background: #111111;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.25);
        color: #fff;
        font-family: system-ui, Arial, sans-serif;
        font-size: 14px;
        letter-spacing: 0.04em;
        cursor: pointer;
        z-index: 10;
      }
      #overlay.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <iframe id="player" allow="autoplay; fullscreen"></iframe>

    <div id="overlay">clicar para activar som</div>

    <script>
      (async function () {
        const player = document.getElementById("player");
        const overlay = document.getElementById("overlay");
        const COLLECTION = "vhstvshows";

        async function randomIdentifier() {
          const page = Math.floor(Math.random() * 100) + 1;
          const rows = 20;
          const q = encodeURIComponent(
            `collection:${COLLECTION} AND mediatype:movies`
          );

          const url =
            `https://archive.org/advancedsearch.php?q=${q}` +
            `&fl[]=identifier&rows=${rows}&page=${page}&output=json`;

          const res = await fetch(url);
          const data = await res.json();
          const docs = data.response.docs;
          return docs[Math.floor(Math.random() * docs.length)].identifier;
        }

        function embedUrl(id, muted = true) {
          return `https://archive.org/embed/${id}?autoplay=1${
            muted ? "&mute=1" : ""
          }`;
        }

        const id = await randomIdentifier();
        player.src = embedUrl(id, true);

        // activar som após gesto do utilizador
        overlay.addEventListener(
          "click",
          () => {
            overlay.classList.add("hidden");

            // recarrega o embed sem mute (gesto já ocorreu)
            player.src = embedUrl(id, false);
          },
          { once: true }
        );
      })();
    </script>
  </body>
</html>
