<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <title>Archive Frame</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: black;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      iframe {
        width: 100vw;
        height: 100vh;
        border: 0;
        background: black;
      }
    </style>
  </head>
  <body>
    <iframe id="player" allow="autoplay" allowfullscreen> </iframe>

    <script>
      const player = document.getElementById("player");

      async function getRandomIdentifier() {
        const page = Math.floor(Math.random() * 500) + 1;

        const url =
          "https://archive.org/advancedsearch.php" +
          "?q=mediatype:(movies)" +
          "&fl[]=identifier" +
          "&rows=1" +
          "&page=" +
          page +
          "&output=json";

        const res = await fetch(url);
        const data = await res.json();

        if (!data.response.docs.length) throw "sem resultados";
        return data.response.docs[0].identifier;
      }

      async function loadVideo() {
        try {
          const id = await getRandomIdentifier();
          player.src = `https://archive.org/embed/${id}?autoplay=1`;
        } catch {
          setTimeout(loadVideo, 1000);
        }
      }

      loadVideo();
    </script>
  </body>
</html>
