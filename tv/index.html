<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <title>Archive Frame</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: black;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      video {
        width: 100vw;
        height: 100vh;
        object-fit: contain;
        background: black;
      }
    </style>
  </head>
  <body>
    <video id="player" autoplay muted playsinline></video>

    <script>
      const player = document.getElementById("player");
      let loading = false;

      async function getRandomVideoURL() {
        const page = Math.floor(Math.random() * 500) + 1;

        const searchURL =
          "https://archive.org/advancedsearch.php" +
          "?q=mediatype:(movies)" +
          "&fl[]=identifier" +
          "&rows=5" +
          "&page=" +
          page +
          "&output=json";

        const searchRes = await fetch(searchURL);
        const searchData = await searchRes.json();

        for (const doc of searchData.response.docs) {
          const id = doc.identifier;
          const metaRes = await fetch(`https://archive.org/metadata/${id}`);
          const metaData = await metaRes.json();

          const file = metaData.files.find(
            (f) => f.format === "MPEG4" && f.name.endsWith(".mp4")
          );

          if (file) {
            return `https://archive.org/download/${id}/${file.name}`;
          }
        }

        throw "nenhum mp4 válido";
      }

      async function playOnce() {
        if (loading) return;
        loading = true;

        try {
          const url = await getRandomVideoURL();
          player.src = url;
          player.load();
          await player.play();
        } catch (e) {
          setTimeout(playOnce, 1000);
        } finally {
          loading = false;
        }
      }

      playOnce();
    </script>
  </body>
</html>
